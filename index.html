<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 ربات Moltbook</title>
    <style>
        /* متغیرها */
        :root {
            --primary: #ff6a00;
            --primary-dark: #e55a00;
            --primary-light: #ff8c42;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1f2937;
            --darker: #111827;
            --light: #f9fafb;
            --gray: #6b7280;
            
            --bg: var(--darker);
            --card: var(--dark);
            --text: var(--light);
            --border: #374151;
        }
        
        .light-mode {
            --bg: var(--light);
            --card: white;
            --text: var(--dark);
            --border: #e5e7eb;
        }
        
        /* ریست */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            transition: all 0.3s;
        }
        
        /* لودر */
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* کنتینر */
        .container {
            max-width: 100%;
            padding: 20px;
        }
        
        @media (min-width: 768px) {
            .container {
                max-width: 800px;
                margin: 0 auto;
            }
        }
        
        /* هدر */
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        /* کارت */
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* دکمه‌ها */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 106, 0, 0.3);
        }
        
        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--border);
        }
        
        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
        }
        
        /* فرم‌ها */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
        }
        
        .form-control {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }
        
        /* بج */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-success { background: var(--success); color: white; }
        .badge-warning { background: var(--warning); color: black; }
        .badge-danger { background: var(--danger); color: white; }
        .badge-primary { background: var(--primary); color: white; }
        
        /* پست‌ها */
        .post {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        
        .post-content {
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 12px;
        }
        
        .post-actions {
            display: flex;
            gap: 20px;
        }
        
        .post-action {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text);
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        
        .post-action:hover {
            opacity: 1;
            color: var(--primary);
        }
        
        /* حافظه */
        .memory-container {
            max-height: 200px;
            overflow-y: auto;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
            margin-top: 10px;
            font-size: 13px;
        }
        
        .memory-entry {
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .memory-entry:last-child {
            border-bottom: none;
        }
        
        /* نوتیفیکیشن */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 16px;
            background: var(--card);
            border-radius: 8px;
            border-right: 4px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* فید */
        #feed {
            max-height: 600px;
            overflow-y: auto;
        }
        
        /* کنترل‌ها */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        /* ریسپانسیو */
        @media (max-width: 768px) {
            .controls {
                justify-content: center;
            }
            
            .btn {
                flex: 1;
                min-width: 120px;
            }
            
            .container {
                padding: 10px;
            }
            
            .card {
                padding: 15px;
            }
        }
        
        /* سوئیچ */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border);
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: var(--primary);
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        /* آمار */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }
        
        /* اسکرول‌بار */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }
        
        /* مودال */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-content {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }
        
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- لاگین -->
        <div id="login" class="card">
            <div class="header">
                <h1>🤖 ربات Moltbook</h1>
                <p>فقط با API Key شروع کن</p>
            </div>
            
            <div class="form-group">
                <label class="form-label">🔑 کلید API Moltbook</label>
                <input type="password" id="apiKey" class="form-control" placeholder="کلید API خود را وارد کنید">
                <small style="display: block; margin-top: 8px; opacity: 0.7;">
                    از <a href="https://www.moltbook.com/dashboard" target="_blank" style="color: var(--primary);">moltbook.com/dashboard</a> دریافت کنید
                </small>
            </div>
            
            <div class="form-group">
                <label class="form-label">🤖 کلید API Gemini (اختیاری)</label>
                <input type="password" id="geminiKey" class="form-control" placeholder="برای پاسخ‌های هوشمند">
                <small style="display: block; margin-top: 8px; opacity: 0.7;">
                    از <a href="https://ai.google.dev" target="_blank" style="color: var(--primary);">ai.google.dev</a> دریافت کنید
                </small>
            </div>
            
            <div class="form-group">
                <label class="form-label">🎭 سبک ربات</label>
                <select id="botStyle" class="form-control">
                    <option value="friendly">🤝 دوستانه</option>
                    <option value="professional">💼 حرفه‌ای</option>
                    <option value="funny">😄 طنز</option>
                    <option value="motivational">💪 انگیزشی</option>
                    <option value="simple">🎯 ساده و مختصر</option>
                </select>
            </div>
            
            <button class="btn btn-primary" onclick="login()" style="width: 100%; margin-top: 20px;">
                شروع ربات
            </button>
        </div>
        
        <!-- اپ اصلی -->
        <div id="app" style="display: none;">
            <!-- هدر -->
            <div class="card" style="text-align: center;">
                <h2 id="agentName" style="margin-bottom: 10px;">ربات Moltbook</h2>
                <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                    <div class="badge" id="status">...</div>
                    <button class="btn btn-sm btn-secondary" onclick="toggleTheme()" id="themeBtn">🌙 تم</button>
                    <button class="btn btn-sm btn-secondary" onclick="showSettings()">⚙️ تنظیمات</button>
                    <button class="btn btn-sm btn-danger" onclick="logout()">🚪 خروج</button>
                </div>
            </div>
            
            <!-- کنترل‌ها -->
            <div class="controls">
                <button class="btn btn-primary" onclick="loadFeed()">🔄 بروزرسانی فید</button>
                <button class="btn btn-secondary" onclick="toggleAutoReply()" id="autoReplyBtn">🤖 پاسخ خودکار: روشن</button>
                <button class="btn btn-secondary" onclick="showMemory()">🧠 حافظه</button>
                <button class="btn btn-secondary" onclick="clearMemory()">🗑️ پاک کردن حافظه</button>
            </div>
            
            <!-- ارسال پست -->
            <div class="card">
                <div class="form-group">
                    <label class="form-label">📝 ارسال پست جدید</label>
                    <textarea id="postContent" class="form-control" placeholder="چه خبر؟ از @ برای منشن استفاده کن..." maxlength="280"></textarea>
                    <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                        <small id="charCount">0/280</small>
                        <small>😊 @ #</small>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="sendPost()" style="width: 100%;">ارسال پست</button>
            </div>
            
            <!-- آمار -->
            <div class="card">
                <div class="stats" id="stats">
                    <!-- آمار بارگذاری می‌شود -->
                </div>
            </div>
            
            <!-- حافظه -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <label class="form-label">🧠 حافظه ربات</label>
                    <button class="btn btn-sm btn-secondary" onclick="clearMemory()">پاک کردن</button>
                </div>
                <div class="memory-container" id="memory"></div>
            </div>
            
            <!-- فید -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="font-size: 18px;">📰 فید پست‌ها</h3>
                    <button class="btn btn-sm btn-secondary" onclick="loadFeed()">بروزرسانی</button>
                </div>
                <div id="feed">
                    <!-- پست‌ها اینجا نمایش داده می‌شوند -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- مودال تنظیمات -->
    <div id="settingsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>⚙️ تنظیمات ربات</h3>
                <button class="btn btn-sm btn-secondary" onclick="hideSettings()">✕ بستن</button>
            </div>
            
            <div class="form-group">
                <label class="form-label">⏰ ساعت پاسخ خودکار</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <select id="startHour" class="form-control">
                        <option value="8">8 صبح</option>
                        <option value="9" selected>9 صبح</option>
                        <option value="10">10 صبح</option>
                    </select>
                    <select id="endHour" class="form-control">
                        <option value="20">8 شب</option>
                        <option value="21">9 شب</option>
                        <option value="22" selected>10 شب</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">⏳ تاخیر بین پاسخ‌ها (دقیقه)</label>
                <select id="cooldown" class="form-control">
                    <option value="1">1 دقیقه</option>
                    <option value="5" selected>5 دقیقه</option>
                    <option value="10">10 دقیقه</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-primary" onclick="saveSettings()">💾 ذخیره</button>
                <button class="btn btn-secondary" onclick="hideSettings()">لغو</button>
            </div>
        </div>
    </div>
    
    <!-- نوتیفیکیشن‌ها -->
    <div id="notificationContainer"></div>
    
    <script>
        // ============== متغیرهای سراسری ==============
        let API_KEY = '';
        let GEMINI_KEY = '';
        let BOT_STYLE = 'friendly';
        let AUTO_REPLY = true;
        let MEMORY = [];
        let REPLIED_POSTS = new Set();
        let LAST_POST = 0;
        let SETTINGS = {
            startHour: 9,
            endHour: 22,
            cooldown: 5
        };
        
        // ============== ابزارها ==============
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = 'notification';
            
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };
            
            notification.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 20px;">${icons[type] || icons.info}</span>
                    <div>${message}</div>
                </div>
            `;
            
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
        
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
        }
        
        // ============== ذخیره‌سازی ==============
        function saveData() {
            const data = {
                apiKey: API_KEY,
                geminiKey: GEMINI_KEY,
                botStyle: BOT_STYLE,
                autoReply: AUTO_REPLY,
                memory: MEMORY,
                settings: SETTINGS,
                lastPost: LAST_POST
            };
            localStorage.setItem('moltbook_bot', JSON.stringify(data));
        }
        
        function loadData() {
            const saved = localStorage.getItem('moltbook_bot');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    API_KEY = data.apiKey || '';
                    GEMINI_KEY = data.geminiKey || '';
                    BOT_STYLE = data.botStyle || 'friendly';
                    AUTO_REPLY = data.autoReply !== undefined ? data.autoReply : true;
                    MEMORY = data.memory || [];
                    SETTINGS = data.settings || SETTINGS;
                    LAST_POST = data.lastPost || 0;
                    
                    // آپدیت UI
                    document.getElementById('autoReplyBtn').textContent = 
                        `🤖 پاسخ خودکار: ${AUTO_REPLY ? 'روشن' : 'خاموش'}`;
                    updateMemoryDisplay();
                    
                    return true;
                } catch (e) {
                    console.error('خطا در بارگذاری داده‌ها:', e);
                }
            }
            return false;
        }
        
        function clearData() {
            localStorage.removeItem('moltbook_bot');
            API_KEY = '';
            GEMINI_KEY = '';
            MEMORY = [];
            REPLIED_POSTS.clear();
        }
        
        // ============== API ==============
        async function apiRequest(endpoint, method = 'GET', body = null) {
            if (!API_KEY) {
                showNotification('کلید API وجود ندارد', 'error');
                throw new Error('No API key');
            }
            
            const options = {
                method,
                headers: {
                    'Authorization': `Bearer ${API_KEY}`,
                    'Content-Type': 'application/json'
                }
            };
            
            if (body) {
                options.body = JSON.stringify(body);
            }
            
            try {
                const response = await fetch(`https://www.moltbook.com/api/v1${endpoint}`, options);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                showNotification('خطا در اتصال به سرور', 'error');
                throw error;
            }
        }
        
        // ============== Gemini AI ==============
        async function generateAIResponse(text) {
            if (!GEMINI_KEY) return null;
            
            const styles = {
                friendly: 'شما یک ربات دوستانه و کمک‌کننده هستید. با مهربانی پاسخ دهید و از ایموجی استفاده کنید.',
                professional: 'شما یک ربات حرفه‌ای هستید. پاسخ‌های مختصر و دقیق بدهید.',
                funny: 'شما یک ربات بامزه و شوخ هستید. با طنز و شوخی پاسخ دهید.',
                motivational: 'شما یک مربی انگیزشی هستید. پاسخ‌های الهام‌بخش بدهید.',
                simple: 'شما یک ربات ساده هستید. پاسخ‌های کوتاه و مستقیم بدهید.'
            };
            
            const prompt = `${styles[BOT_STYLE] || styles.friendly}
            
            حافظه:
            ${MEMORY.slice(-5).map(m => `${m.role === 'user' ? 'کاربر' : 'ربات'}: ${m.content}`).join('\n')}
            
            پیام کاربر: ${text}
            
            لطفا پاسخ کوتاه و مناسب بده (کمتر از ۲۰۰ کاراکتر).`;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });
                
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
            } catch (error) {
                console.error('Gemini Error:', error);
                return null;
            }
        }
        
        // ============== مدیریت حافظه ==============
        function addToMemory(role, content) {
            MEMORY.push({
                role,
                content,
                timestamp: Date.now()
            });
            
            // محدودیت حافظه
            if (MEMORY.length > 50) {
                MEMORY = MEMORY.slice(-50);
            }
            
            updateMemoryDisplay();
            saveData();
        }
        
        function updateMemoryDisplay() {
            const container = document.getElementById('memory');
            if (!container) return;
            
            const lastEntries = MEMORY.slice(-10);
            container.innerHTML = lastEntries.map(entry => `
                <div class="memory-entry">
                    <strong style="color: ${entry.role === 'user' ? '#10b981' : '#ff6a00'}">
                        ${entry.role === 'user' ? '👤 کاربر' : '🤖 ربات'}:
                    </strong>
                    ${entry.content.substring(0, 80)}${entry.content.length > 80 ? '...' : ''}
                    <small style="float: left; opacity: 0.6;">${formatDate(entry.timestamp)}</small>
                </div>
            `).join('');
        }
        
        function clearMemory() {
            if (confirm('آیا از پاک کردن حافظه ربات مطمئنید؟')) {
                MEMORY = [];
                updateMemoryDisplay();
                showNotification('حافظه پاک شد', 'success');
                saveData();
            }
        }
        
        // ============== UI ==============
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById('themeBtn');
            btn.textContent = document.body.classList.contains('light-mode') ? '🌙 دارک' : '☀️ لایت';
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }
        
        function showSettings() {
            document.getElementById('startHour').value = SETTINGS.startHour;
            document.getElementById('endHour').value = SETTINGS.endHour;
            document.getElementById('cooldown').value = SETTINGS.cooldown;
            document.getElementById('settingsModal').style.display = 'flex';
        }
        
        function hideSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }
        
        function saveSettings() {
            SETTINGS.startHour = parseInt(document.getElementById('startHour').value);
            SETTINGS.endHour = parseInt(document.getElementById('endHour').value);
            SETTINGS.cooldown = parseInt(document.getElementById('cooldown').value);
            saveData();
            hideSettings();
            showNotification('تنظیمات ذخیره شد', 'success');
        }
        
        function toggleAutoReply() {
            AUTO_REPLY = !AUTO_REPLY;
            const btn = document.getElementById('autoReplyBtn');
            btn.textContent = `🤖 پاسخ خودکار: ${AUTO_REPLY ? 'روشن' : 'خاموش'}`;
            btn.style.background = AUTO_REPLY ? 
                'linear-gradient(135deg, var(--primary), var(--primary-dark))' : 
                'var(--card)';
            showNotification(`پاسخ خودکار ${AUTO_REPLY ? 'فعال' : 'غیرفعال'} شد`, 'info');
            saveData();
        }
        
        function updateCharCount() {
            const textarea = document.getElementById('postContent');
            const counter = document.getElementById('charCount');
            const count = textarea.value.length;
            counter.textContent = `${count}/280`;
            counter.style.color = count > 250 ? 'var(--danger)' : count > 200 ? 'var(--warning)' : 'inherit';
        }
        
        // ============== مدیریت پست‌ها ==============
        async function sendPost() {
            const content = document.getElementById('postContent').value.trim();
            if (!content) {
                showNotification('لطفا متنی وارد کنید', 'warning');
                return;
            }
            
            const btn = document.getElementById('postContent').nextElementSibling;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader" style="width: 20px; height: 20px; margin: 0 auto;"></div>';
            btn.disabled = true;
            
            try {
                await apiRequest('/posts', 'POST', { content });
                showNotification('پست ارسال شد!', 'success');
                document.getElementById('postContent').value = '';
                updateCharCount();
                loadFeed();
                LAST_POST = Date.now();
                saveData();
            } catch (error) {
                showNotification('خطا در ارسال پست', 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        
        async function loadFeed() {
            const feedContainer = document.getElementById('feed');
            const btn = feedContainer.previousElementSibling.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader" style="width: 16px; height: 16px; margin: 0 auto;"></div>';
            btn.disabled = true;
            
            try {
                const data = await apiRequest('/posts');
                const posts = data.posts || [];
                
                // آمار
                let totalLikes = 0;
                let totalReplies = 0;
                let totalPosts = posts.length;
                
                // نمایش پست‌ها
                if (posts.length === 0) {
                    feedContainer.innerHTML = `
                        <div style="text-align: center; padding: 40px 20px; opacity: 0.7;">
                            <div style="font-size: 48px; margin-bottom: 10px;">📭</div>
                            <p>هنوز پستی وجود ندارد!</p>
                            <p style="font-size: 14px; margin-top: 10px;">اولین پست را ارسال کنید</p>
                        </div>
                    `;
                } else {
                    feedContainer.innerHTML = posts.map(post => {
                        totalLikes += post.likes || 0;
                        totalReplies += (post.replies || []).length;
                        
                        return `
                            <div class="post" id="post-${post.id}">
                                <div class="post-header">
                                    <div class="post-avatar">${post.author?.name?.charAt(0) || '?'}</div>
                                    <div style="flex: 1;">
                                        <strong>@${post.author?.name || 'ناشناس'}</strong>
                                        <div style="font-size: 12px; opacity: 0.7;">${formatDate(post.created_at)}</div>
                                    </div>
                                </div>
                                <div class="post-content">${formatContent(post.content)}</div>
                                <div class="post-actions">
                                    <span class="post-action" onclick="likePost('${post.id}')">
                                        ❤️ ${post.likes || 0}
                                    </span>
                                    <span class="post-action" onclick="replyToPost('${post.id}')">
                                        💬 پاسخ
                                    </span>
                                    <span class="post-action" onclick="quotePost('${post.id}')">
                                        🔁 نقل قول
                                    </span>
                                </div>
                                ${post.replies && post.replies.length > 0 ? `
                                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);">
                                        ${post.replies.map(reply => `
                                            <div style="font-size: 13px; margin-bottom: 5px; opacity: 0.9;">
                                                <strong>@${reply.author?.name}:</strong> ${reply.content}
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }).join('');
                    
                    // بررسی برای پاسخ خودکار
                    if (AUTO_REPLY && GEMINI_KEY) {
                        await checkAutoReply(posts);
                    }
                }
                
                // آپدیت آمار
                updateStats(totalPosts, totalLikes, totalReplies);
                
            } catch (error) {
                feedContainer.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: var(--danger);">
                        خطا در بارگذاری فید
                    </div>
                `;
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        
        function formatContent(text) {
            return text
                .replace(/@(\w+)/g, '<strong style="color: var(--primary);">@$1</strong>')
                .replace(/#(\w+)/g, '<strong style="color: var(--primary-light);">#$1</strong>')
                .replace(/\n/g, '<br>');
        }
        
        function updateStats(posts, likes, replies) {
            const container = document.getElementById('stats');
            container.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${posts}</div>
                    <div class="stat-label">پست‌ها</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${likes}</div>
                    <div class="stat-label">لایک‌ها</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${replies}</div>
                    <div class="stat-label">پاسخ‌ها</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${MEMORY.length}</div>
                    <div class="stat-label">حافظه</div>
                </div>
            `;
        }
        
        async function likePost(postId) {
            try {
                await apiRequest(`/posts/${postId}/like`, 'POST');
                showNotification('لایک شد!', 'success');
                loadFeed();
            } catch (error) {
                showNotification('خطا در لایک', 'error');
            }
        }
        
        async function replyToPost(postId) {
            const content = prompt('پاسخ خود را وارد کنید:');
            if (!content) return;
            
            try {
                await apiRequest(`/posts/${postId}/reply`, 'POST', { content });
                showNotification('پاسخ ارسال شد!', 'success');
                loadFeed();
                addToMemory('user', content);
            } catch (error) {
                showNotification('خطا در ارسال پاسخ', 'error');
            }
        }
        
        function quotePost(postId) {
            const post = document.getElementById(`post-${postId}`);
            if (post) {
                const content = post.querySelector('.post-content').textContent;
                const author = post.querySelector('strong').textContent;
                const quote = `پاسخ به ${author}:\n"${content.substring(0, 100)}..."\n\n`;
                document.getElementById('postContent').value = quote;
                document.getElementById('postContent').focus();
                updateCharCount();
            }
        }
        
        // ============== پاسخ خودکار ==============
        async function checkAutoReply(posts) {
            const now = new Date();
            const hour = now.getHours();
            
            // بررسی ساعت مجاز
            if (hour < SETTINGS.startHour || hour >= SETTINGS.endHour) {
                return;
            }
            
            for (const post of posts) {
                // اگر قبلا پاسخ داده‌ایم، رد شو
                if (REPLIED_POSTS.has(post.id)) continue;
                
                // اگر منشن شده‌ایم
                if (post.content.includes('@')) {
                    REPLIED_POSTS.add(post.id);
                    
                    // بررسی دستورات خاص
                    if (post.content.includes('/reset')) {
                        MEMORY = [];
                        await apiRequest(`/posts/${post.id}/reply`, 'POST', { 
                            content: 'حافظه ربات پاک شد! 🧹' 
                        });
                        showNotification('حافظه پاک شد', 'success');
                        continue;
                    }
                    
                    if (post.content.includes('/help')) {
                        await apiRequest(`/posts/${post.id}/reply`, 'POST', { 
                            content: 'دستورات: /reset (پاک کردن حافظه) /help (کمک)' 
                        });
                        continue;
                    }
                    
                    // تولید پاسخ هوشمند
                    addToMemory('user', post.content);
                    const aiResponse = await generateAIResponse(post.content);
                    
                    if (aiResponse) {
                        addToMemory('assistant', aiResponse);
                        await apiRequest(`/posts/${post.id}/reply`, 'POST', { content: aiResponse });
                        showNotification(`پاسخ خودکار به @${post.author?.name}`, 'success');
                    }
                    
                    // تاخیر بین پاسخ‌ها
                    await new Promise(resolve => setTimeout(resolve, SETTINGS.cooldown * 1000));
                }
            }
        }
        
        // ============== ورود و خروج ==============
        async function login() {
            API_KEY = document.getElementById('apiKey').value.trim();
            GEMINI_KEY = document.getElementById('geminiKey').value.trim();
            BOT_STYLE = document.getElementById('botStyle').value;
            
            if (!API_KEY) {
                showNotification('لطفا کلید API را وارد کنید', 'error');
                return;
            }
            
            // تست اتصال
            try {
                const profile = await apiRequest('/agents/me');
                
                if (profile.error) {
                    throw new Error(profile.error);
                }
                
                // ذخیره داده‌ها
                saveData();
                
                // نمایش اپ
                document.getElementById('login').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                
                // آپدیت نام ربات
                const agentName = document.getElementById('agentName');
                if (profile.agent?.name) {
                    agentName.textContent = profile.agent.name;
                }
                
                // بررسی وضعیت
                const status = await apiRequest('/agents/status');
                const statusBadge = document.getElementById('status');
                statusBadge.textContent = status.status === 'active' ? '✅ فعال' : '⚠️ نیاز به تایید';
                statusBadge.className = status.status === 'active' ? 'badge badge-success' : 'badge badge-warning';
                
                // بارگذاری فید
                loadFeed();
                
                showNotification('ربات با موفقیت راه‌اندازی شد!', 'success');
                
                // شروع تایمر
                setInterval(loadFeed, 30000); // هر 30 ثانیه
                
            } catch (error) {
                showNotification('خطا در اتصال: ' + error.message, 'error');
            }
        }
        
        function logout() {
            if (confirm('آیا از خروج مطمئنید؟')) {
                clearData();
                location.reload();
            }
        }
        
        function showMemory() {
            // حافظه در حال نمایش است
            document.getElementById('memory').scrollIntoView({ behavior: 'smooth' });
        }
        
        // ============== مقداردهی اولیه ==============
        document.addEventListener('DOMContentLoaded', function() {
            // بارگذاری تم
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeBtn').textContent = '🌙 دارک';
            }
            
            // بارگذاری داده‌ها
            if (loadData() && API_KEY) {
                // خودکار لاگین کن
                document.getElementById('login').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                document.getElementById('apiKey').value = '••••••••';
                document.getElementById('geminiKey').value = '••••••••';
                document.getElementById('botStyle').value = BOT_STYLE;
                
                // شروع ربات
                setTimeout(async () => {
                    try {
                        const profile = await apiRequest('/agents/me');
                        const agentName = document.getElementById('agentName');
                        if (profile.agent?.name) {
                            agentName.textContent = profile.agent.name;
                        }
                        
                        const status = await apiRequest('/agents/status');
                        const statusBadge = document.getElementById('status');
                        statusBadge.textContent = status.status === 'active' ? '✅ فعال' : '⚠️ نیاز به تایید';
                        statusBadge.className = status.status === 'active' ? 'badge badge-success' : 'badge badge-warning';
                        
                        loadFeed();
                        showNotification('ربات با موفقیت بارگذاری شد', 'success');
                        setInterval(loadFeed, 30000);
                    } catch (error) {
                        showNotification('خطا در اتصال مجدد', 'error');
                    }
                }, 500);
            }
            
            // رویداد شمارنده کاراکتر
            document.getElementById('postContent').addEventListener('input', updateCharCount);
            
            // بستن مودال با کلیک بیرون
            document.getElementById('settingsModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    hideSettings();
                }
            });
            
            // کلیدهای میانبر
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter' && document.getElementById('postContent').value.trim()) {
                    sendPost();
                }
                
                if (e.key === 'Escape') {
                    hideSettings();
                }
            });
        });
    </script>
